# Curated wishlist of papers that would strengthen the KB but are not yet in
# papers/pdf/. scripts/check_pdfs.py cross-references this against the vault and
# papers/pdf/ to regenerate papers/WANTED.md, so this file is the only place to
# edit. Anything whose PDF lands in papers/pdf/ drops off the generated list
# automatically.
#
# priority: 1 = the KB currently makes a claim it cannot fully source
#           2 = would let an existing note go deeper
#           3 = provenance and completeness

wanted:
  # ---------------------------------------------------------------- priority 1
  - eprint: "2024/669"
    title: "Mempool Privacy via Batched Threshold Encryption: Attacks and Defenses"
    authors: Choudhuri, Garg, Piet, Policharla
    priority: 1
    why: >-
      The paper that introduces batched threshold encryption and the attacks
      motivating D7. Several notes cite its attacks; none can quote them.
      USENIX Security 2024.

  - eprint: "2025/1384"
    title: "Silent Threshold Encryption with One-Shot Adaptive Security"
    authors: Hall-Andersen, Simkin, Wagner
    priority: 1
    why: >-
      The one-shot adaptive corruption model sits between static and fully
      adaptive and is cited in D6. Also the paper most often misread as the
      folklore naive baseline, so the KB needs its actual construction on record.

  - eprint: "2025/2115"
    title: "Weighted Batched Threshold Encryption with Applications to Mempool Privacy"
    authors: Agarwal, Babel, Das, Poorebrahim Gilkalaye, Mondal, Pinkas, Rindal, Yadav
    priority: 1
    why: >-
      The FFT-friendly replacement for BEAT-MEV's KH-PPRF, and the only weighted
      construction in the KB. Stake-weighted committees are the realistic
      deployment shape on a PoS chain.

  - eprint: "2024/1516"
    title: "Practical Mempool Privacy via One-time Setup Batched Threshold Encryption"
    authors: Choudhuri, Garg, Policharla, Wang
    priority: 1
    why: >-
      The middle step between epoch-based and epoch-free, and per Wagner it needs
      a new interactive assumption for its proof. That assumption node cannot be
      written honestly without the paper.

  # ---------------------------------------------------------------- priority 2
  - eprint: "2024/239"
    title: "Simulation-Secure Threshold PKE from Standard (Ring-)LWE"
    authors: Micciancio, Suhl
    priority: 2
    why: >-
      Follow-up to 2023/1728 that moves to standard Ring-LWE. Directly relevant
      to whether the polynomial-modulus line rests on standard assumptions, and
      not in the original brief.

  - eprint: "2026/1585"
    title: "Proving Threshold Regev PKE from Adaptive Hint-MLWE"
    priority: 2
    why: >-
      Sources the hint-mlwe assumption node, currently written from a search
      result rather than the paper.

  - eprint: "2025/1547"
    title: "Silent Threshold Cryptography from Pairings: Expressive Policies in the Plain Model"
    authors: Waters, Wu
    priority: 2
    why: >-
      The standard-model pairing route to silent setup with expressive policies.
      Useful as the classical upper bound the lattice line is chasing.

  - eprint: "2026/372"
    title: "Distributed monotone-policy encryption from l-decomposed LWE"
    priority: 2
    why: Second lattice route to silent setup; needed to compare against 2026/318 and 2026/1464.

  - eprint: "2026/021"
    title: "State of the art for lattice threshold encryption (per Wagner's note, March 2026)"
    priority: 2
    why: >-
      Wagner's note flags this as the current best lattice threshold encryption.
      If that holds it should be a central node.

  - eprint: "2024/1575"
    title: "APTOS batched threshold IBE"
    authors: Agarwal, Fernando, Pinkas
    priority: 2
    why: The other batched threshold IBE besides BLT, for the D12 comparison.

  - eprint: "2025/2103"
    title: "Batched threshold IBE with silent setup"
    priority: 2
    why: Pairing-based, silent, static. Fills the silent-plus-batched-IBE corner.

  - eprint: "2026/1195"
    title: "Encrypted Mempools without Committees and via Proof of Work"
    priority: 2
    why: >-
      A committee-free alternative. Worth a node so the KB does not implicitly
      assume threshold encryption is the only route to an encrypted mempool.

  - eprint: "2025/2048"
    title: "Agarwal et al. (2)"
    priority: 3
    why: Listed in Wagner's note; scope unclear without the paper.

  - eprint: "2026/1609"
    title: "Uncategorized in Wagner's note"
    priority: 3
    why: In Wagner's TODO list; unknown relevance.

  - eprint: "2026/760"
    title: "BTX (second version)"
    priority: 3
    why: >-
      Wagner records 2026/754 and 2026/760 as identical schemes. Having both
      would let the KB state that from the sources rather than on his word.

  # ---------------------------------------------------------------- provenance
  - eprint: "2017/956"
    title: "Threshold Cryptosystems From Threshold Fully Homomorphic Encryption"
    authors: Boneh, Gennaro, Goldfeder, Jain, Kim, Rasmussen, Sahai
    priority: 3
    why: Sources the universal thresholdizer note, the root of PQ-threshold-with-setup.

  - eprint: "2022/284"
    title: "Lattice-Based Zero-Knowledge Proofs and Applications"
    authors: Lyubashevsky, Nguyen, Plancon
    priority: 3
    why: Sources the LNP technique note.

  - eprint: "2022/1341"
    title: "LaBRADOR: Compact Proofs for R1CS from Module-SIS"
    authors: Beullens, Seiler
    priority: 3
    why: Sources the LaBRADOR technique note.

  - eprint: "2021/927"
    title: "A New Simple Technique to Bootstrap Various Lattice ZK Proofs to QROM Secure NIZKs"
    authors: Katsumata
    priority: 3
    why: Sources the Katsumata transform note.

  - title: "Circuit ABE and succinct LWE (l-succinct LWE)"
    authors: Wee
    venue: CRYPTO 2024
    priority: 2
    why: >-
      The origin of the l-succinct LWE assumption that Champion-Wu and TACET's
      silent variant depend on. The assumption node currently cites it
      second-hand. eprint number not yet verified, so do not cite one.

  - title: "Trapdoors for Hard Lattices and New Cryptographic Constructions"
    authors: Gentry, Peikert, Vaikuntanathan
    venue: STOC 2008
    priority: 3
    why: Sources gaussian-preimage-sampling and the Klein/GPV sampler notes.

  - title: "Key Homomorphic PRFs and Their Applications"
    authors: Boneh, Lewi, Montgomery, Raghunathan
    venue: CRYPTO 2013
    priority: 2
    why: >-
      The BLMR matrix-product PRF that beatmev-pq-implementation instantiates.
      Needed to check the PQ BEAT-MEV parameter derivation.

  - title: "On Lattices, Learning with Errors, Random Linear Codes, and Cryptography"
    authors: Regev
    venue: STOC 2005
    priority: 3
    why: Sources the LWE assumption node and the Regev PKE that Bendlin-Damgard and Pilvi thresholdize.

  - title: "EIP-8105: Universal Enshrined Encrypted Mempool"
    url: https://eips.ethereum.org/EIPS/eip-8105
    priority: 2
    why: >-
      The deployment target. Encryption-agnostic by design, so it defines the
      interface any scheme in this KB would have to meet. Not a paper, but the
      most decision-relevant document outside the literature.

  - title: "SoK: Consensus for Fair Message Ordering"
    url: https://arxiv.org/abs/2411.09981
    priority: 2
    why: >-
      Post-inclusion ordering is an open problem in this KB and is a consensus
      question, not a cryptography one. This is the survey that frames it.

# Curated wishlist of papers that would strengthen the KB but are not yet in
# papers/pdf/. scripts/check_pdfs.py cross-references this against the vault and
# papers/pdf/ to regenerate papers/WANTED.md, so this file is the only place to
# edit. Anything whose PDF lands in papers/pdf/ drops off the generated list
# automatically.
#
# priority: 1 = the KB currently makes a claim it cannot fully source
#           2 = would let an existing note go deeper
#           3 = provenance and completeness

wanted:
  # ---------------------------------------------------------------- priority 1
  - title: "Circuit ABE and succinct LWE (l-succinct LWE)"
    authors: Wee
    venue: CRYPTO 2024
    priority: 2
    why: >-
      The origin of the l-succinct LWE assumption that Champion-Wu and TACET's
      silent variant depend on. The assumption node currently cites it
      second-hand. eprint number not yet verified, so do not cite one.

  - title: "Trapdoors for Hard Lattices and New Cryptographic Constructions"
    authors: Gentry, Peikert, Vaikuntanathan
    venue: STOC 2008
    priority: 3
    why: Sources gaussian-preimage-sampling and the Klein/GPV sampler notes.

  - title: "Key Homomorphic PRFs and Their Applications"
    authors: Boneh, Lewi, Montgomery, Raghunathan
    venue: CRYPTO 2013
    priority: 2
    why: >-
      The BLMR matrix-product PRF that beatmev-pq-implementation instantiates.
      Needed to check the PQ BEAT-MEV parameter derivation.

  - title: "On Lattices, Learning with Errors, Random Linear Codes, and Cryptography"
    authors: Regev
    venue: STOC 2005
    priority: 3
    why: Sources the LWE assumption node and the Regev PKE that Bendlin-Damgard and Pilvi thresholdize.

  - title: "EIP-8105: Universal Enshrined Encrypted Mempool"
    url: https://eips.ethereum.org/EIPS/eip-8105
    priority: 2
    why: >-
      The deployment target. Encryption-agnostic by design, so it defines the
      interface any scheme in this KB would have to meet. Not a paper, but the
      most decision-relevant document outside the literature.

  - title: "SoK: Consensus for Fair Message Ordering"
    url: https://arxiv.org/abs/2411.09981
    priority: 2
    why: >-
      Post-inclusion ordering is an open problem in this KB and is a consensus
      question, not a cryptography one. This is the survey that frames it.

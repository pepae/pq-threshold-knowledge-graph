name: ci

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate vault and graph
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Script self-tests
        run: python scripts/test_kb.py

      - name: graph.json is up to date
        run: python scripts/build_graph.py --check

      - name: Validate vault
        run: python scripts/validate.py

      - name: Skill query smoke test
        run: python skill/scripts/query.py stats

      - name: papers/WANTED.md is up to date
        run: |
          python scripts/check_pdfs.py --write
          git diff --exit-code papers/WANTED.md

      - name: Build site
        run: python scripts/build_webapp.py

      - name: Upload Pages artifact
        if: github.ref_name == github.event.repository.default_branch && github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: deploy to GitHub Pages
    if: github.ref_name == github.event.repository.default_branch && github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
